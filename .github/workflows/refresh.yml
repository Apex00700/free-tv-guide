name: Refresh TV guide

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (matches Kodi's fastest refresh)
  workflow_dispatch:          # "Run workflow" button for manual runs

permissions:
  contents: write   # monthly keep-alive note
  pages: write      # publish the files on GitHub Pages
  id-token: write   # required by GitHub Pages publishing
  actions: write    # keep-alive: re-enable this workflow

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install image library (for the colored logo cards; runs on GitHub, not on the Shield)
        run: pip install pillow==11.3.0

      - name: Build channel list and 2-day guide
        run: python build.py

      # Daily "trending" file for the Apex TV front door (On Demand tile): 4 movies + 4 shows from TMDB's day-trending lists.
      # The key is read ONLY from the repository secret TMDB_API_KEY (never printed). Without the secret, or if TMDB can't be reached,
      # nothing is written and this step still succeeds.
      - name: Build the daily trending file (TMDB)
        continue-on-error: true
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python trending.py

      # Daily GENRE TILE pictures for the Apex On Demand home/hub (Tony 2026-11-09): 7 darkened tile pictures + genre.json in site/ (site/genre/<slug>.jpg).
      # Same secret, read only from the environment (never printed). Without the secret or if TMDB cannot be reached, yesterday's pictures are carried forward
      # (if under 72 h old) and the step still succeeds; the Shield then shows its own illustrated scene for any tile without a picture.
      - name: Build the daily genre tile pictures (TMDB)
        continue-on-error: true
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python genre_tiles.py

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5

      # Keep-alive 1: tell GitHub this scheduled workflow is in use (resets the 60-day pause clock).
      - name: Keep-alive (re-enable workflow)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/refresh.yml/enable" || true

      # Keep-alive 2: a tiny commit about once a month counts as repository activity.
      - name: Keep-alive (monthly note)
        run: |
          month=$(date -u +%Y-%m)
          if [ "$(cat last-refresh-month.txt 2>/dev/null)" != "$month" ]; then
            echo "$month" > last-refresh-month.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last-refresh-month.txt
            git commit -m "Monthly keep-alive $month"
            git push
          fi
